[project]
name = "portfolio_advisor"
version = "0.1.0"
description = "portfolio_advisor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "ag-ui-crewai>=1.0.0",
    "crewai[tools]>=1.15.30,<2.0.0",
    "litellm>=1.102.4,<1.103",
    "numpy>=2.2.6",
    "pandas>=2.3.3,<4",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "efea71ee-4919-465a-8bb8-5f80e4e2ecc8"
